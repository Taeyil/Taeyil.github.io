<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 가계부</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:var(--surface-0,#f5f5f3);color:var(--text-primary,#1a1a18);min-height:100vh}
.tab-nav{display:flex;border-top:0.5px solid var(--border,#d8d6ce);background:var(--surface-2,#fff);position:fixed;bottom:0;left:0;right:0;z-index:100;max-width:680px;margin:0 auto}
.tab-btn{flex:1;padding:10px 4px 12px;border:none;background:transparent;font-size:11px;font-family:inherit;cursor:pointer;color:var(--text-secondary,#888);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-btn .ico{font-size:20px}
.tab-btn.active{color:var(--text-primary)}
.page{max-width:680px;margin:0 auto;padding:1rem 1rem 5rem}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--surface-2,#fff);border:0.5px solid var(--border,#d8d6ce);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.card-title{font-size:14px;font-weight:500;margin-bottom:0.75rem}
.card-sub{font-size:12px;color:var(--text-secondary);margin-bottom:0.5rem}
.net-hero{background:var(--surface-2,#fff);border:0.5px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;text-align:center}
.net-label{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.net-value{font-size:30px;font-weight:500;letter-spacing:-0.5px}
.net-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1rem}
.net-card{background:var(--surface-1,#f0efe8);border-radius:8px;padding:0.75rem 1rem}
.net-card-label{font-size:11px;color:var(--text-secondary);margin-bottom:3px}
.net-card-val{font-size:17px;font-weight:500}
.c-asset{color:#0f6e56}.c-debt{color:#993c1d}.c-pos{color:#185fa5}.c-neg{color:#993c1d}
.c-income{color:#0f6e56}.c-expense{color:#993c1d}.c-prin{color:#185fa5}.c-int{color:#ba7517}
.item-list{display:flex;flex-direction:column}
.item-row{display:flex;align-items:center;gap:10px;padding:0.75rem 0;border-bottom:0.5px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:11px;color:var(--text-secondary);margin-top:2px}
.item-right{text-align:right;flex-shrink:0}
.item-amount{font-size:14px;font-weight:500}
.item-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px 5px;font-size:13px;color:var(--text-muted,#bbb);flex-shrink:0}
.btn-icon:hover{color:var(--text-secondary)}.btn-del:hover{color:#d85a30}
.empty-row{text-align:center;padding:1.5rem;color:var(--text-secondary);font-size:13px}
.form-section{margin-top:0.75rem;padding-top:0.75rem;border-top:0.5px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.trio{grid-template-columns:1fr 1fr 1fr}
input,select{width:100%;padding:9px 10px;border:0.5px solid var(--border,#d8d6ce);border-radius:8px;font-size:14px;background:var(--surface-2,#fff);color:var(--text-primary);font-family:inherit;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:#185fa5}
.btn-primary{width:100%;padding:10px;background:var(--surface-0,#f5f5f3);border:0.5px solid var(--border-strong,#b4b2a9);border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--text-primary);margin-top:4px}
.btn-primary:hover{background:var(--surface-1)}
.err{color:#d85a30;font-size:12px;margin-top:4px;min-height:14px}
.month-nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.month-nav button{background:var(--surface-2,#fff);border:0.5px solid var(--border);border-radius:8px;padding:7px 16px;font-size:15px;cursor:pointer;color:var(--text-primary);font-family:inherit}
.month-label{font-size:16px;font-weight:500;flex:1;text-align:center}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.summary-card{background:var(--surface-1,#f0efe8);border-radius:8px;padding:0.75rem 1rem}
.summary-label{font-size:11px;color:var(--text-secondary);margin-bottom:3px}
.summary-value{font-size:17px;font-weight:500}
.type-tabs{display:flex;gap:4px;margin-bottom:8px}
.type-tab{flex:1;padding:8px;border:0.5px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:14px;font-family:inherit;color:var(--text-secondary)}
.type-tab.exp{background:#faece7;border-color:#993c1d;color:#4a1b0c}
.type-tab.inc{background:#e1f5ee;border-color:#0f6e56;color:#04342c}
.tx-card{background:var(--surface-2,#fff);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.tx-item{display:flex;align-items:center;gap:10px;padding:0.75rem 1rem;border-bottom:0.5px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px}
.tx-meta{font-size:11px;color:var(--text-secondary);margin-top:2px}
.tx-amount{font-size:14px;font-weight:500;flex-shrink:0}
.empty{text-align:center;padding:2.5rem;color:var(--text-secondary);font-size:13px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px}
.budget-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bbar-wrap{flex:1;height:6px;background:var(--surface-0);border-radius:3px;overflow:hidden}
.bbar{height:100%;border-radius:3px;background:#1d9e75;transition:width .4s}
.bbar.warn{background:#ba7517}.bbar.over{background:#d85a30}
.chart-wrap{height:160px;position:relative;margin-bottom:8px}
canvas{width:100%!important}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lpill{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary)}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.loan-bar-wrap{height:4px;background:var(--surface-0);border-radius:2px;overflow:hidden;margin-top:5px}
.loan-bar{height:100%;border-radius:2px;background:#993c1d}

/* 부채 상세 영역 */
.debt-detail{background:var(--surface-1,#f0efe8);border-radius:10px;padding:0.875rem 1rem;margin-top:0.5rem}
.debt-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem}
.debt-detail-title{font-size:13px;font-weight:500}

/* 필터 탭 */
.filter-tabs{display:flex;gap:4px;margin-bottom:0.75rem}
.filter-tab{padding:5px 12px;border:0.5px solid var(--border);border-radius:20px;background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:var(--text-secondary)}
.filter-tab.active{background:var(--text-primary);border-color:var(--text-primary);color:#fff}
.filter-nav{display:flex;align-items:center;gap:6px;margin-bottom:0.75rem}
.filter-nav button{background:var(--surface-2,#fff);border:0.5px solid var(--border);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text-primary);font-family:inherit}
.filter-nav-label{font-size:13px;font-weight:500;flex:1;text-align:center}

/* 상환 요약 */
.repay-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:0.75rem}
.repay-card{background:var(--surface-2,#fff);border-radius:8px;padding:0.6rem 0.875rem}
.repay-card-label{font-size:10px;color:var(--text-secondary);margin-bottom:2px}
.repay-card-val{font-size:14px;font-weight:500}

/* 상환 이력 행 */
.repay-item{display:flex;align-items:center;gap:8px;padding:0.6rem 0;border-bottom:0.5px solid var(--border)}
.repay-item:last-child{border-bottom:none}
.repay-badge{font-size:11px;padding:2px 7px;border-radius:10px;flex-shrink:0;font-weight:500}
.badge-prin{background:#e8f1fa;color:#185fa5}
.badge-int{background:#fdf3e3;color:#7a4d0f}
.repay-info{flex:1;min-width:0}
.repay-date{font-size:12px;color:var(--text-secondary)}
.repay-note{font-size:13px}
.repay-amount{font-size:13px;font-weight:500;flex-shrink:0}

/* 상환 추가 폼 */
.repay-form{margin-top:0.75rem;padding-top:0.75rem;border-top:0.5px solid var(--border)}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface-2,#fff);border-radius:16px 16px 0 0;padding:1.25rem;width:100%;max-width:680px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary);padding:0 4px}
.hint{font-size:11px;color:var(--text-secondary);margin-bottom:4px;min-height:14px}
.status{font-size:11px;color:var(--text-secondary);position:fixed;bottom:68px;right:12px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:6px;padding:3px 8px;opacity:0;transition:opacity .2s;z-index:150}
.status.show{opacity:1}
.sync-label{font-size:11px;color:var(--text-secondary);padding:0.5rem 1rem 0;display:block}

@media(max-width:400px){
  .summary-grid{grid-template-columns:1fr 1fr}
  .summary-grid .summary-card:last-child{grid-column:1/-1}
  .form-row.trio{grid-template-columns:1fr 1fr}
  .repay-summary{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<span class="sync-label" id="sync-label">연결 중...</span>
<div class="page">

  <!-- 순자산 탭 -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="net-hero">
      <div class="net-label">순자산 (총자산 − 총부채)</div>
      <div class="net-value" id="net-value">—</div>
      <div class="net-grid">
        <div class="net-card"><div class="net-card-label">총자산</div><div class="net-card-val c-asset" id="net-asset">—</div></div>
        <div class="net-card"><div class="net-card-label">총부채</div><div class="net-card-val c-debt" id="net-debt">—</div></div>
      </div>
    </div>
    <div class="card"><div class="card-title">자산 현황</div><div id="dash-assets"><div class="empty-row">자산 탭에서 추가해주세요.</div></div></div>
    <div class="card"><div class="card-title">부채 현황</div><div id="dash-debts"><div class="empty-row">부채 탭에서 추가해주세요.</div></div></div>
  </div>

  <!-- 자산 탭 -->
  <div id="tab-assets" class="tab-content">
    <div class="card">
      <div class="card-title">자산 목록</div>
      <div id="asset-list"><div class="empty-row">등록된 자산이 없어요.</div></div>
      <div class="form-section">
        <div class="card-sub">자산 추가</div>
        <div class="form-row">
          <input type="text" id="a-name" placeholder="자산명 (예: 청약통장)">
          <select id="a-type">
            <option value="예금">🏦 예금/적금</option>
            <option value="부동산">🏠 부동산</option>
            <option value="현금">💵 현금</option>
            <option value="연금">👴 연금</option>
            <option value="기타">📌 기타</option>
          </select>
        </div>
        <div class="form-row">
          <input type="number" id="a-amount" placeholder="현재 금액 (원)">
          <input type="text" id="a-note" placeholder="메모 (선택)">
        </div>
        <div class="err" id="a-err"></div>
        <button class="btn-primary" onclick="addAsset()">자산 추가</button>
      </div>
    </div>
  </div>

  <!-- 부채 탭 -->
  <div id="tab-debts" class="tab-content">
    <div class="card">
      <div class="card-title">부채 목록</div>
      <div id="debt-list"><div class="empty-row">등록된 부채가 없어요.</div></div>
      <div class="form-section">
        <div class="card-sub">부채 추가</div>
        <div class="form-row">
          <input type="text" id="d-name" placeholder="부채명 (예: 주담대)">
          <select id="d-type">
            <option value="주택담보대출">🏠 주택담보대출</option>
            <option value="전세대출">🔑 전세대출</option>
            <option value="신용대출">💳 신용대출</option>
            <option value="자동차할부">🚗 자동차할부</option>
            <option value="기타대출">📌 기타대출</option>
          </select>
        </div>
        <div class="form-row trio">
          <input type="number" id="d-total" placeholder="총 대출금액">
          <input type="number" id="d-remain" placeholder="남은 잔액">
          <input type="number" id="d-rate" placeholder="금리(%) 예:3.5">
        </div>
        <div class="err" id="d-err"></div>
        <button class="btn-primary" onclick="addDebt()">부채 추가</button>
      </div>
    </div>
  </div>


  <!-- 카드 탭 -->
  <div id="tab-cards" class="tab-content">
    <div class="card">
      <div class="card-title">카드 목록</div>
      <div id="card-list"><div class="empty-row">등록된 카드가 없어요.</div></div>
      <div class="form-section">
        <div class="card-sub">카드 추가</div>
        <div class="form-row">
          <input type="text" id="c-name" placeholder="카드명 (예: 신한 체크카드)">
          <select id="c-linked-asset">
            <option value="">연결 예금 없음</option>
          </select>
        </div>
        <div class="err" id="c-err"></div>
        <button class="btn-primary" onclick="addCard()">카드 추가</button>
      </div>
    </div>
  </div>
  <!-- 가계부 탭 -->
  <div id="tab-budget" class="tab-content">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="month-label"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="summary-grid">
      <div class="summary-card"><div class="summary-label">수입</div><div class="summary-value c-income" id="s-income">0원</div></div>
      <div class="summary-card"><div class="summary-label">지출</div><div class="summary-value c-expense" id="s-expense">0원</div></div>
      <div class="summary-card"><div class="summary-label">잔액</div><div class="summary-value" id="s-balance">0원</div></div>
    </div>
    <div class="card">
      <div class="card-title">이번 달 예산</div>
      <div class="budget-row">
        <span style="font-size:12px;color:var(--text-secondary);width:72px;flex-shrink:0" id="b-used">0원</span>
        <div class="bbar-wrap"><div class="bbar" id="b-bar" style="width:0%"></div></div>
        <span style="font-size:12px;color:var(--text-secondary);width:34px;text-align:right;flex-shrink:0" id="b-pct">—</span>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:4px" id="b-info">예산을 설정하면 현황을 볼 수 있어요.</div>
      <div style="margin-top:10px;padding-top:10px;border-top:0.5px solid #d8d6ce">
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="b-input" placeholder="이번 달 예산 입력" style="flex:1;min-width:0;width:auto">
          <button onclick="saveBudget()" style="padding:9px 16px;border:0.5px solid #d8d6ce;border-radius:8px;background:#f0efe8;cursor:pointer;font-size:13px;font-family:-apple-system,sans-serif;white-space:nowrap;color:#1a1a18;flex-shrink:0;width:auto;-webkit-appearance:none">설정</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">카테고리별 지출</div>
      <div class="chart-wrap"><canvas id="pie"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <div class="card-title">내역 추가</div>
      <div class="type-tabs">
        <button class="type-tab exp" id="t-exp" onclick="setType('expense')">지출</button>
        <button class="type-tab" id="t-inc" onclick="setType('income')">수입</button>
      </div>
      <div class="form-row">
        <input type="text" id="f-desc" placeholder="항목명 (예: 점심식사)" maxlength="30">
        <input type="number" id="f-amount" placeholder="금액 (원)">
      </div>
      <div class="form-row">
        <select id="f-cat" onchange="updateHint()"></select>
        <input type="date" id="f-date">
      </div>
      <select id="f-asset-sel" style="display:none;margin-bottom:8px"></select>
      <div class="hint" id="f-hint"></div>
      <div class="err" id="f-err"></div>
      <button class="btn-primary" onclick="addTx()">추가하기</button>
    </div>
    <div style="font-size:14px;font-weight:500;margin-bottom:0.5rem">이번 달 내역</div>
    <div id="list-wrap"></div>
  </div>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('dashboard')"><span class="ico">📊</span>순자산</button>
  <button class="tab-btn" onclick="showTab('assets')"><span class="ico">🏦</span>자산</button>
  <button class="tab-btn" onclick="showTab('debts')"><span class="ico">💳</span>부채</button>
  <button class="tab-btn" onclick="showTab('cards')"><span class="ico">💳</span>카드</button>
  <button class="tab-btn" onclick="showTab('budget')"><span class="ico">📒</span>가계부</button>
</nav>

<!-- 자산 수정 모달 -->
<div class="modal-bg" id="modal-asset">
  <div class="modal">
    <div class="modal-title">자산 수정 <button class="modal-close" onclick="closeModal('modal-asset')">✕</button></div>
    <input type="hidden" id="ea-id">
    <div class="form-row">
      <input type="text" id="ea-name" placeholder="자산명">
      <select id="ea-type">
        <option value="예금">🏦 예금/적금</option>
        <option value="부동산">🏠 부동산</option>
        <option value="현금">💵 현금</option>
        <option value="연금">👴 연금</option>
        <option value="기타">📌 기타</option>
      </select>
    </div>
    <div class="form-row">
      <input type="number" id="ea-amount" placeholder="현재 금액 (원)">
      <input type="text" id="ea-note" placeholder="메모 (선택)">
    </div>
    <div class="err" id="ea-err"></div>
    <button class="btn-primary" onclick="saveAsset()">수정 저장</button>
  </div>
</div>

<!-- 부채 수정 모달 -->
<div class="modal-bg" id="modal-debt">
  <div class="modal">
    <div class="modal-title">부채 수정 <button class="modal-close" onclick="closeModal('modal-debt')">✕</button></div>
    <input type="hidden" id="ed-id">
    <div class="form-row">
      <input type="text" id="ed-name" placeholder="부채명">
      <select id="ed-type">
        <option value="주택담보대출">🏠 주택담보대출</option>
        <option value="전세대출">🔑 전세대출</option>
        <option value="신용대출">💳 신용대출</option>
        <option value="자동차할부">🚗 자동차할부</option>
        <option value="기타대출">📌 기타대출</option>
      </select>
    </div>
    <div class="form-row trio">
      <input type="number" id="ed-total" placeholder="총 대출금액">
      <input type="number" id="ed-remain" placeholder="남은 잔액">
      <input type="number" id="ed-rate" placeholder="금리(%)">
    </div>
    <div class="err" id="ed-err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const CAT_EXP=['식비','교통','쇼핑','의료','문화','교육','통신','공과금','카드결제','카드대금납부','예적금납입','대출원금','대출이자','기타'];
const CAT_INC=['급여','부수입','기타'];
const EMOJI={식비:'🍚',교통:'🚌',쇼핑:'🛍',의료:'🏥',문화:'🎬',교육:'📚',통신:'📱',공과금:'💡',카드결제:'💳',카드대금납부:'💸',예적금납입:'🏦',대출원금:'🏠',대출이자:'💳',급여:'💰',부수입:'📈',기타:'📌',예금:'🏦',부동산:'🏠',현금:'💵',연금:'👴',주택담보대출:'🏠',전세대출:'🔑',신용대출:'💳',자동차할부:'🚗',기타대출:'📌',카드:'💳'};
const CCOLOR={식비:'#1d9e75',교통:'#185fa5',쇼핑:'#d85a30',의료:'#d4537e',문화:'#7f77dd',교육:'#ba7517',통신:'#378add',공과금:'#639922',카드결제:'#7f77dd',카드대금납부:'#993c1d',예적금납입:'#0f6e56',대출원금:'#993c1d',대출이자:'#d85a30',급여:'#1d9e75',부수입:'#185fa5',기타:'#888780'};

let db=null, curType='expense', curY=new Date().getFullYear(), curM=new Date().getMonth();
let chart=null, txList=[], budgetAmt=0, assetList=[], debtList=[], repayList=[], cardList=[];
let unsubCards=null;
let unsubTx=null, unsubBudget=null, unsubAssets=null, unsubDebts=null, unsubRepay=null;
// 상환이력 모달 상태
let repayFilter='month', repayPeriodY=new Date().getFullYear(), repayPeriodM=new Date().getMonth(), repayDebtId=null;

const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const mk=()=>`${curY}-${String(curM+1).padStart(2,'0')}`;
const uid=()=>'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);

function showStatus(msg){
  const el=document.getElementById('status');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);
}
function showTab(name){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  const idx={dashboard:0,assets:1,debts:2,cards:3,budget:4}[name];
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');});
});

// ── 가계부 ──────────────────────────────
function setType(t){
  curType=t;
  document.getElementById('t-exp').className='type-tab'+(t==='expense'?' exp':'');
  document.getElementById('t-inc').className='type-tab'+(t==='income'?' inc':'');
  const cats=t==='income'?CAT_INC:CAT_EXP;
  document.getElementById('f-cat').innerHTML=cats.map(c=>`<option value="${c}">${EMOJI[c]||'📌'} ${c}</option>`).join('');
  updateHint();
}
function updateHint(){
  const cat=document.getElementById('f-cat').value;
  const sel=document.getElementById('f-asset-sel');
  const h=document.getElementById('f-hint');
  sel.style.display='none';
  if(cat==='예적금납입'){
    const savings=assetList.filter(a=>a.assetType==='예금');
    if(savings.length>1){
      sel.style.display='';
      sel.innerHTML=savings.map(a=>`<option value="${a.id}">${a.name} (현재 ${fmt(a.amount||0)})</option>`).join('');
      h.textContent='✦ 선택한 예적금 자산 잔액에 자동 반영돼요.';
    } else {
      h.textContent='✦ 예적금 자산 잔액에 자동 반영돼요.';
    }
  } else if(cat==='카드결제'){
    if(cardList.length>0){
      sel.style.display='';
      sel.innerHTML=cardList.map(c=>`<option value="${c.id}">${c.name} (미결제 ${fmt(c.unpaid||0)})</option>`).join('');
    }
    h.textContent='✦ 자산 차감 없이 카드 미결제 금액에 누적돼요.';
  } else if(cat==='카드대금납부'){
    if(cardList.length>0){
      sel.style.display='';
      sel.innerHTML=cardList.map(c=>`<option value="${c.id}">${c.name} (미결제 ${fmt(c.unpaid||0)})</option>`).join('');
    }
    h.textContent='✦ 카드 미결제 금액이 줄고, 연결된 예금 자산에서 차감돼요.';
  } else if(cat==='대출원금'){
    h.textContent='✦ 부채 잔액이 줄어들고 상환이력에 기록돼요.';
  } else if(cat==='대출이자'){
    h.textContent='✦ 이자 납부로 상환이력에 기록돼요.';
  } else {
    h.textContent='';
  }
}
function changeMonth(d){
  curM+=d;if(curM<0){curM=11;curY--;}if(curM>11){curM=0;curY++;}
  updateLabel();if(db)subscribeTx();
}
function updateLabel(){
  const ns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('month-label').textContent=`${curY}년 ${ns[curM]}`;
}
async function addTx(){
  const desc=document.getElementById('f-desc').value.trim();
  const amount=parseInt(document.getElementById('f-amount').value);
  const cat=document.getElementById('f-cat').value;
  const date=document.getElementById('f-date').value;
  const err=document.getElementById('f-err');err.textContent='';
  if(!desc){err.textContent='항목명을 입력해주세요.';return;}
  if(!amount||amount<=0){err.textContent='올바른 금액을 입력해주세요.';return;}
  if(!date){err.textContent='날짜를 선택해주세요.';return;}
  if(!db){err.textContent='연결 중이에요. 잠시 후 다시 시도해주세요.';return;}
  const id='tx'+uid();
  const sel=document.getElementById('f-asset-sel');
  const selVal=sel.style.display!=='none'?sel.value:null;
  try{
    showStatus('저장 중...');
    let linkedAssetId=null, linkedCardId=null;
    if(curType==='expense'){
      if(cat==='예적금납입'){
        const savings=assetList.filter(a=>a.assetType==='예금');
        linkedAssetId=selVal||(savings.length===1?savings[0].id:null);
      } else if(cat==='카드결제'){
        // 카드결제: 카드 미결제 누적만, 자산 차감 없음
        linkedCardId=selVal||(cardList.length===1?cardList[0].id:null);
      } else if(cat==='카드대금납부'){
        // 카드대금납부: 카드 미결제 차감 + 예금자산 차감
        linkedCardId=selVal||(cardList.length===1?cardList[0].id:null);
        const savings=assetList.filter(a=>a.assetType==='예금');
        linkedAssetId=savings.length?savings[0].id:null;
      }
    }
    await db.doc(`transactions/${mk()}_${id}`).set({id,desc,amount,cat,date,type:curType,createdAt:Date.now(),month:mk(),linkedAssetId,linkedCardId});
    if(curType==='expense'){
      if(cat==='예적금납입') await autoUpdateAsset(amount, linkedAssetId);
      else if(cat==='카드결제') await autoCardCharge(amount, linkedCardId);
      else if(cat==='카드대금납부') await autoCardPayment(amount, linkedCardId, linkedAssetId);
      else if(cat==='대출원금') await autoAddRepay(amount,'원금',date,desc);
      else if(cat==='대출이자') await autoAddRepay(amount,'이자',date,desc);
    }
    document.getElementById('f-desc').value='';
    document.getElementById('f-amount').value='';
    showStatus('저장됨 ✓');
  }catch(e){err.textContent='저장 실패 ('+(e.code||e.message)+')';showStatus('');}
}
async function autoUpdateAsset(amount, linkedAssetId){
  const savings=assetList.filter(a=>a.assetType==='예금');
  if(!savings.length)return;
  const t=linkedAssetId ? savings.find(a=>a.id===linkedAssetId)||savings[0] : savings[0];
  await db.doc(`assets/${t.id}`).set({...t,amount:(t.amount||0)+amount});
}
// 카드결제: 카드 미결제 금액 증가 (자산 변동 없음)
async function autoCardCharge(amount, linkedCardId){
  if(!linkedCardId) return;
  const card=cardList.find(c=>c.id===linkedCardId);
  if(!card) return;
  await db.doc(`cards/${linkedCardId}`).set({...card, unpaid:(card.unpaid||0)+amount});
}
// 카드대금납부: 카드 미결제 차감 + 예금자산 차감
async function autoCardPayment(amount, linkedCardId, linkedAssetId){
  if(linkedCardId){
    const card=cardList.find(c=>c.id===linkedCardId);
    if(card){
      const newUnpaid=Math.max(0,(card.unpaid||0)-amount);
      await db.doc(`cards/${linkedCardId}`).set({...card, unpaid:newUnpaid});
    }
  }
  if(linkedAssetId){
    const asset=assetList.find(a=>a.id===linkedAssetId);
    if(asset){
      const newAmt=Math.max(0,(asset.amount||0)-amount);
      await db.doc(`assets/${linkedAssetId}`).set({...asset, amount:newAmt});
    }
  }
}
async function autoAddRepay(amount,type,date,note){
  if(!debtList.length)return;
  const t=debtList[debtList.length-1];
  const rid='rp'+uid();
  const month=date.slice(0,7);
  await db.doc(`repayments/${t.id}_${rid}`).set({id:rid,debtId:t.id,type,amount,date,month,note:note||'',createdAt:Date.now()});
  if(type==='원금'){
    const newRemain=Math.max(0,(t.remain||0)-amount);
    await db.doc(`debts/${t.id}`).set({...t,remain:newRemain});
  }
}
async function deleteTx(docId){
  if(!db)return;
  try{
    const snap=await db.doc(`transactions/${docId}`).get();
    const tx=snap.exists?snap.data():null;
    showStatus('삭제 중...');
    await db.doc(`transactions/${docId}`).delete();
    if(tx && tx.type==='expense' && tx.amount>0){
      if(tx.cat==='예적금납입'){
        // 예적금납입 삭제 → 자산 차감
        const savings=assetList.filter(a=>a.assetType==='예금');
        const target=tx.linkedAssetId?savings.find(a=>a.id===tx.linkedAssetId)||savings[0]:savings[0];
        if(target) await db.doc(`assets/${target.id}`).set({...target,amount:Math.max(0,(target.amount||0)-tx.amount)});
      } else if(tx.cat==='카드결제'){
        // 카드결제 삭제 → 카드 미결제 차감
        if(tx.linkedCardId){
          const card=cardList.find(c=>c.id===tx.linkedCardId);
          if(card) await db.doc(`cards/${tx.linkedCardId}`).set({...card,unpaid:Math.max(0,(card.unpaid||0)-tx.amount)});
        }
      } else if(tx.cat==='카드대금납부'){
        // 카드대금납부 삭제 → 카드 미결제 복원 + 예금자산 복원
        if(tx.linkedCardId){
          const card=cardList.find(c=>c.id===tx.linkedCardId);
          if(card) await db.doc(`cards/${tx.linkedCardId}`).set({...card,unpaid:(card.unpaid||0)+tx.amount});
        }
        if(tx.linkedAssetId){
          const asset=assetList.find(a=>a.id===tx.linkedAssetId);
          if(asset) await db.doc(`assets/${tx.linkedAssetId}`).set({...asset,amount:(asset.amount||0)+tx.amount});
        }
      }
    }
    showStatus('삭제됨 ✓');
  }catch(e){showStatus('삭제 실패');}
}
async function saveBudget(){
  const val=parseInt(document.getElementById('b-input').value);
  if(!val||val<=0||!db)return;
  try{showStatus('저장 중...');await db.doc(`budgets/${mk()}`).set({amount:val,month:mk()});document.getElementById('b-input').value='';showStatus('예산 저장됨 ✓');}
  catch(e){showStatus('저장 실패');}
}
function renderSummary(){
  const income=txList.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=txList.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const bal=income-expense;
  document.getElementById('s-income').textContent='+'+fmt(income);
  document.getElementById('s-expense').textContent='−'+fmt(expense);
  const bEl=document.getElementById('s-balance');
  bEl.textContent=(bal>=0?'+':'−')+fmt(Math.abs(bal));
  bEl.className='summary-value '+(bal>=0?'c-pos':'c-neg');
  document.getElementById('b-used').textContent=fmt(expense);
  if(budgetAmt>0){
    const pct=Math.min(Math.round((expense/budgetAmt)*100),100);
    document.getElementById('b-pct').textContent=pct+'%';
    const bar=document.getElementById('b-bar');bar.style.width=pct+'%';
    bar.className='bbar'+(pct>=100?' over':pct>=80?' warn':'');
    document.getElementById('b-info').textContent=pct>=100?`예산 ${fmt(budgetAmt)} 초과 — ${fmt(expense-budgetAmt)} 더 썼어요.`:`예산 ${fmt(budgetAmt)} 중 ${fmt(budgetAmt-expense)} 남았어요.`;
    document.getElementById('b-input').placeholder='현재: '+fmt(budgetAmt);
  }else{
    document.getElementById('b-pct').textContent='—';
    document.getElementById('b-bar').style.width='0%';
    document.getElementById('b-info').textContent='예산을 설정하면 현황을 볼 수 있어요.';
  }
}
function renderChart(){
  const bycat={};txList.filter(t=>t.type==='expense').forEach(t=>{bycat[t.cat]=(bycat[t.cat]||0)+t.amount;});
  const labels=Object.keys(bycat),data=Object.values(bycat),colors=labels.map(l=>CCOLOR[l]||'#888780');
  const total=data.reduce((a,b)=>a+b,0);
  const leg=document.getElementById('legend');
  if(!labels.length){leg.innerHTML='<span style="font-size:12px;color:var(--text-secondary)">지출을 추가하면 차트가 표시돼요.</span>';if(chart){chart.destroy();chart=null;}return;}
  leg.innerHTML=labels.map((l,i)=>`<div class="lpill"><div class="ldot" style="background:${colors[i]}"></div>${EMOJI[l]||'📌'} ${l} ${Math.round((data[i]/total)*100)}%</div>`).join('');
  const ctx=document.getElementById('pie').getContext('2d');
  if(chart)chart.destroy();
  chart=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${Math.round(c.raw).toLocaleString('ko-KR')}원`}}}}});
}
function renderTxList(){
  const wrap=document.getElementById('list-wrap');
  if(!txList.length){wrap.innerHTML='<div class="empty">이번 달 내역이 없어요.<br>내역을 추가해보세요!</div>';return;}
  const sorted=[...txList].sort((a,b)=>b.date.localeCompare(a.date));
  wrap.innerHTML='<div class="tx-card">'+sorted.map(tx=>`
    <div class="tx-item">
      <div class="tx-icon" style="background:${tx.type==='income'?'#e1f5ee':'#faece7'}">${EMOJI[tx.cat]||'📌'}</div>
      <div class="tx-info"><div class="tx-desc">${tx.desc}</div><div class="tx-meta">${tx.date} · ${tx.cat}</div></div>
      <div class="tx-amount" style="color:${tx.type==='income'?'#0f6e56':'#993c1d'}">${tx.type==='income'?'+':'−'}${Math.round(tx.amount).toLocaleString('ko-KR')}원</div>
      <button class="btn-icon btn-del" onclick="deleteTx('${mk()}_${tx.id}')">✕</button>
    </div>`).join('')+'</div>';
}

// ── 자산 ──────────────────────────────
async function addAsset(){
  const name=document.getElementById('a-name').value.trim();
  const assetType=document.getElementById('a-type').value;
  const amount=parseInt(document.getElementById('a-amount').value);
  const note=document.getElementById('a-note').value.trim();
  const err=document.getElementById('a-err');err.textContent='';
  if(!name){err.textContent='자산명을 입력해주세요.';return;}
  if(isNaN(amount)||amount<0){err.textContent='금액을 입력해주세요.';return;}
  if(!db){err.textContent='연결 중이에요.';return;}
  const id='ast'+uid();
  try{
    showStatus('저장 중...');
    await db.doc(`assets/${id}`).set({id,name,assetType,amount,note,createdAt:Date.now()});
    document.getElementById('a-name').value='';document.getElementById('a-amount').value='';document.getElementById('a-note').value='';
    showStatus('자산 추가됨 ✓');
  }catch(e){err.textContent='저장 실패 ('+(e.code||e.message)+')';showStatus('');}
}
function editAsset(id){
  const a=assetList.find(x=>x.id===id);if(!a)return;
  document.getElementById('ea-id').value=a.id;
  document.getElementById('ea-name').value=a.name;
  document.getElementById('ea-type').value=a.assetType;
  document.getElementById('ea-amount').value=a.amount;
  document.getElementById('ea-note').value=a.note||'';
  document.getElementById('ea-err').textContent='';
  openModal('modal-asset');
}
async function saveAsset(){
  const id=document.getElementById('ea-id').value;
  const name=document.getElementById('ea-name').value.trim();
  const assetType=document.getElementById('ea-type').value;
  const amount=parseInt(document.getElementById('ea-amount').value);
  const note=document.getElementById('ea-note').value.trim();
  const err=document.getElementById('ea-err');err.textContent='';
  if(!name){err.textContent='자산명을 입력해주세요.';return;}
  if(isNaN(amount)||amount<0){err.textContent='금액을 입력해주세요.';return;}

// ── 상환이력 ──────────────────────────────
function openRepayModal(debtId){
  repayDebtId=debtId;
  repayPeriodY=new Date().getFullYear();
  repayPeriodM=new Date().getMonth();
  const d=debtList.find(x=>x.id===debtId);
  document.getElementById('repay-modal-title').textContent=(d?d.name:'') + ' 상환이력';
  document.getElementById('repay-debt-id').value=debtId;
  document.getElementById('rp-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('rp-amount').value='';
  document.getElementById('rp-note').value='';
  document.getElementById('rp-err').textContent='';
  setRepayFilter(repayFilter, true);
  openModal('modal-repay');
  if(db) subscribeRepay(debtId);
}
function setRepayFilter(f, force){
  if(repayFilter===f && !force) return;
  repayFilter=f;
  document.querySelectorAll('#repay-filter-tabs .filter-tab').forEach((btn,i)=>{
    btn.className='filter-tab'+((['day','month','year'][i]===f)?' active':'');
  });
  renderRepayPeriodLabel();
  renderRepayList();
}
function moveRepayPeriod(d){
  if(repayFilter==='year'){repayPeriodY+=d;}
  else if(repayFilter==='month'){
    repayPeriodM+=d;
    if(repayPeriodM<0){repayPeriodM=11;repayPeriodY--;}
    if(repayPeriodM>11){repayPeriodM=0;repayPeriodY++;}
  }else{
    // 일별: 현재 표시 날짜 이동
    const cur=new Date(repayPeriodY,repayPeriodM,repayDayOfMonth||1);
    cur.setDate(cur.getDate()+d);
    repayPeriodY=cur.getFullYear();repayPeriodM=cur.getMonth();repayDayOfMonth=cur.getDate();
  }
  renderRepayPeriodLabel();renderRepayList();
}
let repayDayOfMonth=new Date().getDate();
function renderRepayPeriodLabel(){
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const lbl=document.getElementById('repay-period-label');
  if(repayFilter==='year') lbl.textContent=repayPeriodY+'년';
  else if(repayFilter==='month') lbl.textContent=`${repayPeriodY}년 ${mns[repayPeriodM]}`;
  else lbl.textContent=`${repayPeriodY}년 ${mns[repayPeriodM]} ${repayDayOfMonth}일`;
}
function getFilteredRepay(){
  if(!repayDebtId) return [];
  const all=repayList.filter(r=>r.debtId===repayDebtId);
  if(repayFilter==='year') return all.filter(r=>r.date.startsWith(String(repayPeriodY)));
  if(repayFilter==='month'){
    const mk=`${repayPeriodY}-${String(repayPeriodM+1).padStart(2,'0')}`;
    return all.filter(r=>r.date.startsWith(mk));
  }
  // 일별
  const dk=`${repayPeriodY}-${String(repayPeriodM+1).padStart(2,'0')}-${String(repayDayOfMonth).padStart(2,'0')}`;
  return all.filter(r=>r.date===dk);
}
function renderRepayList(){
  renderRepayPeriodLabel();
  const filtered=getFilteredRepay().sort((a,b)=>b.date.localeCompare(a.date));
  const prin=filtered.filter(r=>r.type==='원금').reduce((s,r)=>s+r.amount,0);
  const intr=filtered.filter(r=>r.type==='이자').reduce((s,r)=>s+r.amount,0);
  document.getElementById('rs-prin').textContent=fmt(prin);
  document.getElementById('rs-int').textContent=fmt(intr);
  const wrap=document.getElementById('repay-list');
  if(!filtered.length){wrap.innerHTML='<div class="empty-row">이 기간에 상환 내역이 없어요.</div>';return;}
  wrap.innerHTML=filtered.map(r=>`
    <div class="repay-item">
      <span class="repay-badge ${r.type==='원금'?'badge-prin':'badge-int'}">${r.type}</span>
      <div class="repay-info">
        <div class="repay-note">${r.note||'—'}</div>
        <div class="repay-date">${r.date}</div>
      </div>
      <div class="repay-amount ${r.type==='원금'?'c-prin':'c-int'}">${fmt(r.amount)}</div>
      <button class="btn-icon btn-del" onclick="deleteRepay('${r.debtId}_${r.id}')">✕</button>
    </div>`).join('');
}
async function addRepay(){
  const debtId=document.getElementById('repay-debt-id').value;
  const type=document.getElementById('rp-type').value;
  const amount=parseInt(document.getElementById('rp-amount').value);
  const date=document.getElementById('rp-date').value;
  const note=document.getElementById('rp-note').value.trim();
  const err=document.getElementById('rp-err');err.textContent='';
  if(!amount||amount<=0){err.textContent='금액을 입력해주세요.';return;}
  if(!date){err.textContent='날짜를 선택해주세요.';return;}
  if(!db){err.textContent='연결 중이에요.';return;}
  const month=date.slice(0,7);
  const rid='rp'+uid();
  try{
    showStatus('저장 중...');
    await db.doc(`repayments/${debtId}_${rid}`).set({id:rid,debtId,type,amount,date,month,note,createdAt:Date.now()});
    if(type==='원금'){
      const d=debtList.find(x=>x.id===debtId);

    }
    document.getElementById('rp-amount').value='';document.getElementById('rp-note').value='';
    showStatus('상환이력 추가됨 ✓');
  }catch(e){err.textContent='저장 실패 ('+(e.code||e.message)+')';showStatus('');}
}
async function deleteRepay(docId){
  if(!db)return;
  try{showStatus('삭제 중...');await db.doc(`repayments/${docId}`).delete();showStatus('삭제됨 ✓');}
  catch(e){showStatus('삭제 실패');}

// ── 순자산 ──────────────────────────────
function renderNetworth(){
  const totalA=assetList.reduce((s,a)=>s+(a.amount||0),0);
  const totalCard=cardList.reduce((s,c)=>s+(c.unpaid||0),0);
  const totalD=debtList.reduce((s,d)=>s+(d.remain||0),0)+totalCard;
  const net=totalA-totalD;
  document.getElementById('net-asset').textContent=fmt(totalA);
  document.getElementById('net-debt').textContent=fmt(totalD);
  const nEl=document.getElementById('net-value');
  nEl.textContent=(net>=0?'':'-')+fmt(Math.abs(net));
  nEl.className='net-value '+(net>=0?'c-pos':'c-neg');
  const dA=document.getElementById('dash-assets'),dD=document.getElementById('dash-debts');
  dA.innerHTML=!assetList.length?'<div class="empty-row">자산 탭에서 추가해주세요.</div>':
    '<div class="item-list">'+assetList.map(a=>`<div class="item-row"><div class="item-icon" style="background:#e1f5ee;font-size:14px">${EMOJI[a.assetType]||'📌'}</div><div class="item-info"><div class="item-name">${a.name}</div><div class="item-meta">${a.assetType}</div></div><div class="item-amount c-asset">${fmt(a.amount||0)}</div></div>`).join('')+'</div>';
  const debtItems=[...debtList.map(d=>`<div class="item-row"><div class="item-icon" style="background:#faece7;font-size:14px">${EMOJI[d.debtType]||'📌'}</div><div class="item-info"><div class="item-name">${d.name}</div><div class="item-meta">${d.debtType}</div></div><div class="item-amount c-debt">−${fmt(d.remain||0)}</div></div>`),...cardList.filter(c=>c.unpaid>0).map(c=>`<div class="item-row"><div class="item-icon" style="background:#f3eefa;font-size:14px">💳</div><div class="item-info"><div class="item-name">${c.name}</div><div class="item-meta">카드 미결제</div></div><div class="item-amount" style="color:#7f77dd">−${fmt(c.unpaid||0)}</div></div>`)];
  dD.innerHTML=!debtItems.length?'<div class="empty-row">부채/카드 탭에서 추가해주세요.</div>':'<div class="item-list">'+debtItems.join('')+'</div>';
}

// ── 구독 ──────────────────────────────
function subscribeTx(){
  if(unsubTx){unsubTx();unsubTx=null;}
  if(unsubBudget){unsubBudget();unsubBudget=null;}
  const key=mk();
  unsubBudget=db.doc(`budgets/${key}`).onSnapshot(snap=>{
    budgetAmt=snap.exists?(snap.data()?.amount||0):0;renderSummary();
  },e=>console.error('budget',e));
  unsubTx=db.collection('transactions').where('month','==',key).onSnapshot(snap=>{
    txList=snap.docs.filter(d=>d.exists).map(d=>d.data());
    renderSummary();renderChart();renderTxList();
  },e=>console.error('tx',e));
}
function subscribeAssets(){
  if(unsubAssets){unsubAssets();unsubAssets=null;}

function subscribeCards(){
  if(unsubCards){unsubCards();unsubCards=null;}

function subscribeRepay(debtId){

    repayList=snap.docs.filter(d=>d.exists).map(d=>d.data());

}

function init(){
  updateLabel();setType('expense');

window._fbDb = {
  doc: (path) => {
    const parts = path.split('/');
    const colName = parts[0];
    const docId = parts.slice(1).join('_');
    const ref = fdb.collection(colName).doc(docId);
    return {
      set:    (data)   => ref.set(data),
      update: (data)   => ref.set(data, {merge:true}),
      delete: ()       => ref.delete(),
      get:    async () => {
        const s = await ref.get();
        return { exists: s.exists, data: () => s.data() };
      },
      onSnapshot: (cb, err) => ref.onSnapshot(s => {
        cb({ exists: s.exists, data: () => s.data() });
      }, err||console.error)
    };
  },
  collection: (colName) => ({
    where: (field, op, val) => ({
      onSnapshot: (cb, err) => {
        return fdb.collection(colName).where(field, op, val).onSnapshot(s => {
          cb({ docs: s.docs.map(d => ({ exists: d.exists, data: () => d.data() })) });
        }, err||console.error);
      }
    }),
    onSnapshot: (cb, err) => fdb.collection(colName).onSnapshot(s => {
      cb({ docs: s.docs.map(d => ({ exists: d.exists, data: () => d.data() })) });
    }, err||console.error)
  })
};

window._fbReady = true;
window.dispatchEvent(new Event('fbReady'));
