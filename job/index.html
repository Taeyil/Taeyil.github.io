    var dt=v("a3");S.L.apps.push({id:uid(),company:v("a1"),job:v("a2"),date:dt,deadline:v("a4"),url:v("a5"),note:"",stages:[{id:uid(),name:"서류",date:dt,result:dt?"제출완료":"작성 중"}]});save();render();toast("지원 내역을 추가했어요");return;
  }
  if(d.addst){var P=S.L.apps.filter(function(x){return x.id===d.id})[0];P.stages.push({id:uid(),name:d.addst,date:"",result:"대기"});save();render();return}
  if(d.delst){
    if(arm!=="s"+d.delst){arm="s"+d.delst;t.textContent="삭제?";return}
    arm=null;var P2=S.L.apps.filter(function(x){return x.id===d.id})[0];P2.stages=P2.stages.filter(function(x){return x.id!==d.delst});save();render();return;
  }
  if(d.ql){
    var q=v("q1"),mx=v("m1"),tx=$("#t1")?$("#t1").value:"";
    if(!q){setSt("항목을 입력해 주세요");return}
    var Ap=S.L.apps.filter(function(x){return x.id===d.ql})[0];
    if(formL&&formL.id){var L1=S.L.letters.filter(function(x){return x.id===formL.id})[0];if(L1){L1.q=q;L1.text=tx;L1.max=mx}}
    else S.L.letters.push({id:uid(),appId:Ap.id,company:Ap.company,q:q,text:tx,max:mx});
    formL=null;save();render();toast("자소서를 저장했어요");return;
  }
  if(d.cp){var C=S.L.letters.filter(function(x){return x.id===d.cp})[0];if(C)copy(C.text||"","자소서를 복사했어요");return}
  if(d.ql2){formL={id:d.ql2};render();return}
  if(d.qc){formL=null;render();return}
  if(d.del){
    if(arm!==d.del+d.id){arm=d.del+d.id;t.textContent="정말 삭제?";return}arm=null;
    S.L[d.del]=S.L[d.del].filter(function(x){return x.id!==d.id});save();render();toast("삭제했어요");
  }
}

  if(t.dataset.sid){var st=it.stages.filter(function(x){return x.id===t.dataset.sid})[0];if(!st)return;st[t.dataset.f]=t.value}
  else it[t.dataset.f]=t.value;
  save();
}

(async function(){
  if(!FIREBASE_CONFIG.apiKey){setSt("firebaseConfig를 넣어야 연동돼요 (지금은 이 기기에만 저장)");return}
  try{
    var V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
    var A=await import(B+"firebase-app.js"),Au=await import(B+"firebase-auth.js"),F=await import(B+"firebase-firestore.js");
    var app=A.getApps().length?A.getApp():A.initializeApp(FIREBASE_CONFIG);
    var auth=Au.getAuth(app),fs=F.getFirestore(app),unsub=null;
    var loArm=false;
    $("#lo").onclick=async function(){
      var b=this;
      if(!loArm){loArm=true;b.textContent="한 번 더 누르면 로그아웃";setTimeout(function(){loArm=false;if(b.textContent!=="로그아웃")b.textContent="로그아웃"},3000);return}
      loArm=false;b.disabled=true;
      try{
        clearTimeout(timer);
        if(pending&&ref){setSt("저장 중…");await ref.set({json:JSON.stringify(S.L),t:Date.now()})}
        pending=false;if(unsub){unsub();unsub=null}ref=null;
        await Au.signOut(auth);
        try{localStorage.removeItem("jobprep2")}catch(e){}
        S.L=fill({});form=null;formL=null;OPENID=null;render();
        toast("로그아웃했어요");
      }catch(e){setSt("로그아웃 실패: "+e.message)}
      b.disabled=false;b.textContent="로그아웃";
    };
    $("#lg").onclick=function(){Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(function(e){setSt("로그인 실패: "+e.message)})};
    Au.onAuthStateChanged(auth,function(u){
      if(unsub){unsub();unsub=null}
      if(!u){ref=null;$("#acct").hidden=true;$("#lg").style.display="";setSt("로그인하면 PC·휴대폰이 연동돼요");return}
      $("#lg").style.display="none";$("#acct").hidden=false;$("#who").textContent=u.email||u.displayName||"";$("#lo").textContent="로그아웃";
      var d=F.doc(fs,"jobprep",u.uid);
      ref={set:function(o){return F.setDoc(d,o)}};
      unsub=F.onSnapshot(d,function(snap){
        if(pending||snap.metadata.hasPendingWrites)return;
        setSt("동기화됨 ✓");
        if(!snap.exists()){if(KEYS.some(function(k){return S.L[k].length}))save();return}
        var L;try{L=fill(JSON.parse(snap.data().json))}catch(x){return}
        if(JSON.stringify(L)===JSON.stringify(S.L))return;
        var a=document.activeElement;S.L=L;
        if(!(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")))render();
      },function(x){setSt("동기화 오류: "+x.message)});
    });
  }catch(e){setSt("연동 불가: "+e.message)}
})();
