<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<title>HOME</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#191919; --ink:#e6e6e6; --sub:#9b9b9b; --line:#2f2f2f;
  --tag-bg:#2a2a2a; --tag:#e0675a; --hover:#2a2a2a; --uline:#5a5a5a;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#ffffff; --ink:#37352f; --sub:#787774; --line:#e9e9e7;
    --tag-bg:#f1f1ef; --tag:#d44c47; --hover:#f1f1ef; --uline:#c7c6c3; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;padding:32px 24px calc(48px + env(safe-area-inset-bottom));margin:0 auto}
h1{font-size:44px;font-weight:800;letter-spacing:-.5px;margin:0 0 28px;line-height:1.15}
section{margin-bottom:44px}
section h2{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;
  color:var(--tag);background:var(--tag-bg);padding:3px 7px;border-radius:5px;letter-spacing:.3px}
ul{list-style:none;margin:12px 0 0;padding:0}
li a{display:flex;align-items:center;gap:10px;padding:6px 6px;margin:0 -6px;border-radius:6px;
  color:var(--ink);text-decoration:none;font-size:17px;font-weight:700}
li a:active{background:var(--hover)}
@media (hover:hover){ li a:hover{background:var(--hover)} }
.ic{width:26px;text-align:center;font-size:20px;flex-shrink:0}
.nm{border-bottom:1px solid var(--uline);padding-bottom:1px}
.live{margin-left:auto;font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{height:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>HOME</h1>
  <div id="sections"></div>
</div>

<script>
/* ===================== 노트 목록 =====================
  새 노트는 해당 섹션 items 에 한 줄만 추가하세요.
  icon: 이모지 / name: 이름 / path: 주소 / live: (선택) 오른쪽에 보여줄 정보
=========================================================== */
const SECTIONS = [
  { ko:'계획', en:'PLAN', items:[] },
  { ko:'실행', en:'DO', items:[
    { icon:'🚗', name:'차 관리', path:'/car/', live:carLive },
  ]},
  { ko:'성장', en:'GROW', items:[
    { icon:'📚', name:'STUDY', path:'/study/' },
    { icon:'💼', name:'이직 준비', path:'/job/' },
  ]},
  { ko:'휴식', en:'REST', items:[] },
];

async function carLive(){
  const r = await fetch('/car/odo.json?t='+Date.now(), {cache:'no-store'});
  if(!r.ok) return '';
  const j = await r.json();
  return j.km ? Math.round(j.km).toLocaleString('ko-KR') + ' km' : '';
}

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let n = 0; const lives = [];
document.getElementById('sections').innerHTML = SECTIONS.map(s=>`
  <section>
    <h2>${esc(s.ko)} <span class="tag">${esc(s.en)}</span></h2>
    ${s.items.length ? `<ul>${s.items.map(it=>{
      const id = 'lv'+(n++); if(typeof it.live==='function') lives.push([id,it.live]);
      return `<li><a href="${esc(it.path)}"><span class="ic">${it.icon||'📄'}</span><span class="nm">${esc(it.name)}</span><span class="live" id="${id}"></span></a></li>`;
    }).join('')}</ul>` : '<div class="empty"></div>'}
  </section>`).join('');

lives.forEach(([id,fn])=> fn().then(t=>{ document.getElementById(id).textContent = t||''; }).catch(()=>{}));
</script>
</body>
</html>
