<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<title>HOME</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css">
<style>
:root{
  --bg:#191919; --ink:#e6e6e6; --sub:#9b9b9b; --line:#2f2f2f;
  --tag-bg:#2a2a2a; --tag:#e0675a; --hover:#2a2a2a; --uline:#5a5a5a;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#ffffff; --ink:#37352f; --sub:#787774; --line:#e9e9e7;
    --tag-bg:#f1f1ef; --tag:#d44c47; --hover:#f1f1ef; --uline:#c7c6c3; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito","NanumSquareRound","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;padding:32px 24px calc(48px + env(safe-area-inset-bottom));margin:0 auto}
h1{font-size:44px;font-weight:900;letter-spacing:.5px;margin:0 0 28px;line-height:1.15}
section{margin-bottom:44px}
section h2{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tag{font-size:13px;font-weight:800;
  color:var(--tag);background:var(--tag-bg);padding:3px 8px;border-radius:6px;letter-spacing:.8px}
ul{list-style:none;margin:12px 0 0;padding:0}
li a{display:flex;align-items:center;gap:10px;padding:6px 6px;margin:0 -6px;border-radius:6px;
  color:var(--ink);text-decoration:none;font-size:17px;font-weight:800;letter-spacing:.6px}
li a:active{background:var(--hover)}
@media (hover:hover){ li a:hover{background:var(--hover)} }
.ic{width:22px;height:22px;flex-shrink:0;color:var(--ink);display:grid;place-items:center}
.ic svg{width:21px;height:21px;display:block}
.nm{border-bottom:1px solid var(--uline);padding-bottom:1px}
.live{margin-left:auto;font-size:13px;font-weight:700;letter-spacing:0;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{height:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>HOME</h1>
  <div id="sections"></div>
</div>

<script>
/* 무채색 선 아이콘 — 새 아이콘이 필요하면 여기에 추가 */
const ICONS = {
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4.5l-1.8-4.6a1.5 1.5 0 0 0-1.4-.9H8.2a1.5 1.5 0 0 0-1.4.9L5 12z"/><path d="M5 12h14"/><circle cx="8.2" cy="16.5" r="1.7"/><circle cx="15.8" cy="16.5" r="1.7"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4.5 4.5 4.5v13c3.5 0 6 .5 7.5 2 1.5-1.5 4-2 7.5-2v-13C16 4.5 13.5 5 12 6.5z"/><path d="M12 6.5v13"/></svg>',
  case:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="12" rx="2.5"/><path d="M9 7V5.8A1.8 1.8 0 0 1 10.8 4h2.4A1.8 1.8 0 0 1 15 5.8V7"/><path d="M3.5 12.5h17"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7.5l4 4v12a1 1 0 0 1-1 1h-10.5a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5L3.5 11l1.5-1.5 7 1 4.5-5a2 2 0 0 1 3 3l-5 4.5 1 7L14 21.5l-2.5-7z"/></svg>',
  cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 4.5v1.5M11.5 4.5v1.5"/></svg>',
};

/* ===================== 노트 목록 =====================
  새 노트는 해당 섹션 items 에 한 줄만 추가하세요.
  icon: car / book / case / note / plane / cup 중 선택 / name: 이름 / path: 주소 / live: (선택) 오른쪽에 보여줄 정보
=========================================================== */
const SECTIONS = [
  { ko:'계획', en:'PLAN', items:[] },
  { ko:'실행', en:'DO', items:[
    { icon:'car', name:'GARAGE', path:'/car/', live:carLive },
  ]},
  { ko:'성장', en:'GROW', items:[
    { icon:'book', name:'STUDY', path:'/study/' },
    { icon:'case', name:'CAREER', path:'/job/' },
  ]},
  { ko:'휴식', en:'REST', items:[] },
];

async function carLive(){
  const r = await fetch('/car/odo.json?t='+Date.now(), {cache:'no-store'});
  if(!r.ok) return '';
  const j = await r.json();
  return j.km ? Math.round(j.km).toLocaleString('ko-KR') + ' km' : '';
}

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let n = 0; const lives = [];
document.getElementById('sections').innerHTML = SECTIONS.map(s=>`
  <section>
    <h2>${esc(s.ko)} <span class="tag">${esc(s.en)}</span></h2>
    ${s.items.length ? `<ul>${s.items.map(it=>{
      const id = 'lv'+(n++); if(typeof it.live==='function') lives.push([id,it.live]);
      return `<li><a href="${esc(it.path)}"><span class="ic">${ICONS[it.icon]||ICONS.note}</span><span class="nm">${esc(it.name)}</span><span class="live" id="${id}"></span></a></li>`;
    }).join('')}</ul>` : '<div class="empty"></div>'}
  </section>`).join('');

lives.forEach(([id,fn])=> fn().then(t=>{ document.getElementById(id).textContent = t||''; }).catch(()=>{}));
</script>
</body>
</html>
